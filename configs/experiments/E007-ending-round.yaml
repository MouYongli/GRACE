# E007 ending round (user decision 2026-11-28, follow-up of E006): tuning sequences for the one
# writer-prompt round targeted at endings and changes. Development sequences that E006 did NOT
# score: the second rho-10 sequence and the rho-30 sequence of each family (10 sequences, 140 gold
# endings). E006's five `*-rho10-L200-000` sequences are the confirmation set and are scored once,
# with configs/experiments/E006-graph-quality-sequences.yaml.
#   uv run python -m grace.cli.graph_quality extract-sequences --config configs/experiments/E007-ending-round.yaml \
#       --experiment E007 --writer-url http://localhost:8253/v1 --run-parent "$PROJECT_ROOT/runs/E007/artifacts/w02-E007"
#   uv run python -m grace.cli.graph_quality score-sequences <probe-run-dir> --config configs/experiments/E007-ending-round.yaml \
#       --experiment E007 --judge-url http://localhost:8252/v1 --run-parent "$PROJECT_ROOT/runs/E007/artifacts/w02-E007"
